# TEMPORAL: lo borra la tarea 15 de la etapa 2
name: Medida etapa 2 (temporal)

# La medida que decide las tareas 13 y 14 de la etapa 2 del frontend rápido
# (docs/superpowers/specs/2026-10-08-frontend-rapido-design.md, R3 y R7; el plan, en la
# tarea 1 y la tarea 12). Con tests/rendimiento/etapa2_medir.py mide, en el Python fijado
# del dispositivo (3.14.8, Tk 9.0.4) y en frío, un proceso por medida:
#   - la lista de «Parejas» de tres maneras (la de hoy, filas ligeras y un lienzo) con
#     5, 10, 20 y 50 filas;
#   - «Parejas», «Ajustes» y la ventana de la pasada, rehechas frente a escondidas y
#     enseñadas otra vez;
#   - un perfil de los momentos lentos de la aplicación.
# El resumen sale en el del trabajo (con las dos decisiones al principio) y todo lo
# demás en el artefacto. No hace fallar nunca: lo que no se pudo medir va en el resumen.
#
# Solo se lanza al tocar sus propios ficheros (no el código de la interfaz, para no cargar la
# CI): la tarea 12 lo repite sobre la rama fusionada tocando este fichero. A mano, con
# «Run workflow».
on:
  push:
    branches:
      - claude/adoring-pascal-5j258r
    paths:
      - "tests/rendimiento/etapa2_*"
      - ".github/workflows/medida-etapa2.yml"
  workflow_dispatch:
    inputs:
      rondas:
        description: "Vueltas (mediana de estas)"
        default: "7"

permissions:
  contents: read

concurrency:
  group: medida-etapa2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medir:
    name: medida etapa 2 (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64 }
          - { os: ubuntu-latest, plat: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RENDIMIENTO_PLATAFORMA: ${{ matrix.plat }}
      # Por el entorno y no pegado en la orden: lo escrito al lanzarlo a mano no es código.
      RONDAS: ${{ inputs.rondas || 7 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pantalla de 1920x1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Pantalla virtual y letras (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb libxft2 fontconfig

      - name: Clave de la caché del runtime
        id: pins
        run: python tests/_runtime_ci.py clave

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prdrive-cache
          key: runtime-${{ matrix.plat }}-${{ steps.pins.outputs.clave }}

      - name: Python fijado del dispositivo (Tk 9) (Linux)
        if: runner.os == 'Linux'
        env:
          CI_TEMP: ${{ runner.temp }}
        run: python tests/_runtime_ci.py runtime "$RENDIMIENTO_PLATAFORMA" "$CI_TEMP/runtime" "$CI_TEMP/prdrive-cache"

      - name: Python fijado del dispositivo (Tk 9) (Windows)
        if: runner.os == 'Windows'
        env:
          CI_TEMP: ${{ runner.temp }}
        run: python tests/_runtime_ci.py runtime "$env:RENDIMIENTO_PLATAFORMA" "$env:CI_TEMP/runtime" "$env:CI_TEMP/prdrive-cache"

      - name: Medir (Linux)
        if: runner.os == 'Linux'
        env:
          CI_TEMP: ${{ runner.temp }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/rendimiento/etapa2_medir.py --arbol . --trabajo "$CI_TEMP/e2" --python "$PRDRIVE_PYTHON" --rondas "$RONDAS"

      - name: Medir (Windows)
        if: runner.os == 'Windows'
        env:
          CI_TEMP: ${{ runner.temp }}
        run: python tests/rendimiento/etapa2_medir.py --arbol . --trabajo "$env:CI_TEMP/e2" --python "$env:PRDRIVE_PYTHON" --rondas "$env:RONDAS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medida-etapa2-${{ matrix.plat }}
          path: ${{ runner.temp }}/e2/salida
          if-no-files-found: warn
