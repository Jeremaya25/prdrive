name: Alfa binario con el pintor de Python (medida temporal)

# TEMPORAL: la medida de la etapa 1b (8cdfce6; spec docs/superpowers/specs/2026-10-08-frontend-rapido-design.md
# §1c) repetida sobre el código de hoy. Con Tk 9 las piezas de `caja()` salen por SVG, y nanosvg siempre
# suaviza: el alfa cortado de 8cdfce6 ya no llega a la pantalla. Por eso aquí los DOS árboles pintan con el
# rasterizador de Python (primer paso: `USAR_SVG = False` en ui/icons.py), y la comparación es solo
# suavizado contra binario, con el mismo pintor. En pr/ además el alfa de las piezas de `caja()` se corta a
# 0 o 1 (segundo paso). Mide tests/rendimiento/correr.py el MISMO commit dos veces, con las pasadas
# intercaladas. Es de usar y tirar: se borra en cuanto se ha leído el resultado.
# Ojo con 8cdfce6: cortaba el alfa DESPUÉS de `_ensanchar()`, y pr/ pagaba entonces un recorrido píxel a
# píxel que base/ no paga (ver el segundo paso). Su −48 ms de 7d170b6 salió neto de ese coste, así que
# probablemente subestima la ganancia del binario. Aquí el corte va antes.
on:
  push:
    branches:
      - claude/adoring-pascal-5j258r
    paths:
      - ".github/workflows/alfa-binario-pintor.yml"

permissions:
  contents: read

concurrency:
  group: alfa-binario-pintor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medir:
    name: alfa binario, pintor de Python (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64 }
          - { os: ubuntu-latest, plat: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RENDIMIENTO_PLATAFORMA: ${{ matrix.plat }}
      RENDIMIENTO_PR: binario (pintor Python)
      RENDIMIENTO_BASE: suavizado (pintor Python)
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr

      - uses: actions/checkout@v4
        with:
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pintor de Python en los dos árboles (sin SVG)
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path

          # `svg_disponible()` mira `USAR_SVG` antes que nada: con `False` nunca se le da el SVG a Tk
          # (en Tk 9 lo pintaría nanosvg, que siempre suaviza y no admite el alfa cortado).
          viejo = 'USAR_SVG = os.environ.get("PRDRIVE_SIN_SVG", "") in ("", "0")\n'
          nuevo = "USAR_SVG = False  # medida temporal: el pintor de Python en los dos árboles\n"
          for arbol in ("base", "pr"):
              p = Path(arbol) / "ui" / "icons.py"
              s = p.read_text(encoding="utf-8")
              assert s.count(viejo) == 1, f"{p}: la comprobación de SVG ya no es la que se esperaba"
              linea = s[:s.index(viejo)].count("\n") + 1
              s_nuevo = s.replace(viejo, nuevo)
              compile(s_nuevo, str(p), "exec")          # el parche no debe romper la sintaxis
              p.write_text(s_nuevo, encoding="utf-8")
              print(f"parcheado {p}:{linea}: {viejo.strip()} -> {nuevo.strip()}")
          EOF

      - name: Alfa binario en las piezas de pr/
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path

          p = Path("pr/ui/icons.py")
          s = p.read_text(encoding="utf-8")
          viejo = ("            return _ensanchar(_capas_rgba(capas, float(lado), lado), borde,\n"
                   "                              CENTRO_ANCHO, CENTRO_ALTO)\n")
          # El alfa de `_capas_rgba()` va de 0.0 a 1.0: a partir de la mitad, opaco; por debajo, transparente.
          # Se corta ANTES de `_ensanchar()`: así las filas que repite el centro siguen siendo la misma lista,
          # y `_png()` las reconoce por `id()` (c4a253e). Cortadas después, cada fila es nueva: pr/ pagaría un
          # recorrido píxel a píxel que base/ no paga, y la medida quedaría sesgada contra el binario.
          nuevo = ("            return _ensanchar([[(r, g, b, 1.0 if a >= 0.5 else 0.0) for (r, g, b, a) in fila]\n"
                   "                               for fila in _capas_rgba(capas, float(lado), lado)],\n"
                   "                              borde, CENTRO_ANCHO, CENTRO_ALTO)\n")
          assert s.count(viejo) == 1, "la pieza de caja() ya no es la que se esperaba"
          linea = s[:s.index(viejo)].count("\n") + 1
          s_nuevo = s.replace(viejo, nuevo)
          compile(s_nuevo, str(p), "exec")              # el parche no debe romper la sintaxis
          p.write_text(s_nuevo, encoding="utf-8")
          print(f"parcheado {p}:{linea}: el alfa de las piezas de caja() va a 0 o 1")
          EOF

      - name: Pantalla de 1920x1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Pantalla virtual, letras y capturas (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb libxft2 fontconfig imagemagick

      - name: Clave de la caché del runtime
        id: pins
        run: python pr/tests/_runtime_ci.py clave

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prdrive-cache
          key: runtime-${{ matrix.plat }}-${{ steps.pins.outputs.clave }}

      - name: Python fijado del dispositivo (Tk 9)
        run: python pr/tests/_runtime_ci.py runtime ${{ matrix.plat }} "${{ runner.temp }}/runtime" "${{ runner.temp }}/prdrive-cache"

      - name: Medir (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas 9 --capturas

      - name: Medir (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas 9 --capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfa-binario-pintor-${{ matrix.plat }}
          path: ${{ runner.temp }}/rendimiento/salida
          if-no-files-found: warn
