name: Alfa binario (medida temporal)

# TEMPORAL: la medida de la etapa 1b que decide el alfa binario de las piezas (spec
# docs/superpowers/specs/2026-10-08-frontend-rapido-design.md §1c: se adopta solo si en Windows
# gana más de 20 ms). Mide con tests/rendimiento/correr.py el MISMO commit dos veces: en base/
# tal cual (piezas con el borde suavizado) y en pr/ con el alfa de las piezas de `icons.caja()`
# cortado a 0 o 1 (`_capas_rgba()` lo da de 0.0 a 1.0). Lo que cambia entre los dos es solo lo
# que cuesta pintar. Se borra en cuanto se ha leído el resultado.
on:
  push:
    branches:
      - claude/adoring-pascal-5j258r
    paths:
      - ".github/workflows/alfa-binario.yml"

permissions:
  contents: read

concurrency:
  group: alfa-binario-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medir:
    name: alfa binario (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64 }
          - { os: ubuntu-latest, plat: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RENDIMIENTO_PLATAFORMA: ${{ matrix.plat }}
      RENDIMIENTO_PR: binario
      RENDIMIENTO_BASE: suavizado
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr

      - uses: actions/checkout@v4
        with:
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Alfa binario en las piezas de pr/
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          p = Path("pr/ui/icons.py")
          s = p.read_text(encoding="utf-8")
          viejo = ("            return _ensanchar(_capas_rgba(capas, float(lado), lado), borde,\n"
                   "                              CENTRO_ANCHO, CENTRO_ALTO)\n")
          # El alfa de `_capas_rgba()` va de 0.0 a 1.0.
          nuevo = ("            return [[(r, g, b, 1.0 if a >= 0.5 else 0.0) for (r, g, b, a) in fila]\n"
                   "                    for fila in _ensanchar(_capas_rgba(capas, float(lado), lado),\n"
                   "                                           borde, CENTRO_ANCHO, CENTRO_ALTO)]\n")
          assert s.count(viejo) == 1, "la pieza de caja() ya no es la que se esperaba"
          p.write_text(s.replace(viejo, nuevo), encoding="utf-8")
          print("parcheado", p)
          EOF

      - name: Pantalla de 1920x1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Pantalla virtual, letras y capturas (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb libxft2 fontconfig imagemagick

      - name: Clave de la caché del runtime
        id: pins
        run: python pr/tests/_runtime_ci.py clave

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prdrive-cache
          key: runtime-${{ matrix.plat }}-${{ steps.pins.outputs.clave }}

      - name: Python fijado del dispositivo (Tk 9)
        run: python pr/tests/_runtime_ci.py runtime ${{ matrix.plat }} "${{ runner.temp }}/runtime" "${{ runner.temp }}/prdrive-cache"

      - name: Medir (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas 9 --capturas

      - name: Medir (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas 9 --capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfa-binario-${{ matrix.plat }}
          path: ${{ runner.temp }}/rendimiento/salida
          if-no-files-found: warn
