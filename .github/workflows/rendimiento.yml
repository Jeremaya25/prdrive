name: Rendimiento

# La comprobación de tiempos que se queda (docs/superpowers/specs/2026-10-08-frontend-rapido-design.md §5;
# su código está en tests/rendimiento/). Mide las pantallas de verdad, con el Python fijado del
# dispositivo (3.14.8, Tk 9.0.4), en el árbol del PR y en el de su rama base DENTRO DEL MISMO
# TRABAJO, intercalando las pasadas: la máquina de GitHub varía de una ejecución a otra, pero no
# de un árbol a otro del mismo trabajo. Cada pasada abre, en frío y en un proceso nuevo, la
# ventana principal, «Parejas» y «Ajustes» (con 5 y con 50 parejas, y al 150 %), el asistente, la
# pregunta del agente y la ventana de la pasada, y cuenta widgets, módulos y pasadas de
# <<ThemeChanged>>.
#
# Falla un PR solo por (1) una cuenta determinista por encima de su techo de
# tests/rendimiento/presupuesto.toml o (2) un momento más de un 25 % Y más de 30 ms más lento
# que en la base. Las metas de tiempo salen en el resumen del trabajo, sin hacer fallar.
#
# En un PR que toca el código de la interfaz o lo que ella carga, y a mano (Windows ARM64 solo así:
# marcar «arm64»). La base de un PR es la de su fusión (base.sha); a mano, la rama o commit de
# «base» (main por omisión).
on:
  # TEMPORAL: quitar antes del PR (primera medida en Windows antes de abrirlo; compara con `main`
  # o con la «base» que se pida a mano).
  push:
    branches:
      - claude/adoring-pascal-5j258r
  pull_request:
    paths:
      - "ui/**"
      - "common/**"
      - "install/**"
      - "runsync.py"
      - "sync.py"
      - "agente.py"
      - "pregunta.py"
      - "penwatch.py"
      - "prdrive-install.py"
      - "build_installer.py"
      - "tests/rendimiento/**"
      - "tests/_runtime_ci.py"
      - ".github/workflows/rendimiento.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Rama, etiqueta o commit con el que comparar"
        default: "main"
      rondas:
        description: "Vueltas (mediana de estas)"
        default: "7"
      arm64:
        description: "Medir también en Windows ARM64"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rendimiento-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medir:
    name: rendimiento (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arm64 && '[{"os":"windows-latest","plat":"windows-x64"},{"os":"ubuntu-latest","plat":"linux-x64"},{"os":"windows-11-arm","plat":"windows-arm64"}]' || '[{"os":"windows-latest","plat":"windows-x64"},{"os":"ubuntu-latest","plat":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RENDIMIENTO_PLATAFORMA: ${{ matrix.plat }}
      RENDIMIENTO_PR: ${{ github.event.pull_request.head.sha || github.sha }}
      RENDIMIENTO_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'main' }}
      # Por el entorno y no pegado en la orden: lo escrito al lanzarlo a mano no es código.
      RENDIMIENTO_RONDAS: ${{ inputs.rondas || 7 }}
    steps:
      # El PR (su fusión con la base) en pr/ y la base en base/: dos carpetas, dos árboles.
      - uses: actions/checkout@v4
        with:
          path: pr

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base || 'main' }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pantalla de 1920x1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Pantalla virtual, letras y capturas (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb libxft2 fontconfig imagemagick

      - name: Clave de la caché del runtime
        id: pins
        run: python pr/tests/_runtime_ci.py clave

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/prdrive-cache
          key: runtime-${{ matrix.plat }}-${{ steps.pins.outputs.clave }}

      - name: Python fijado del dispositivo (Tk 9)
        run: python pr/tests/_runtime_ci.py runtime ${{ matrix.plat }} "${{ runner.temp }}/runtime" "${{ runner.temp }}/prdrive-cache"

      - name: Medir (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas "$RENDIMIENTO_RONDAS" --capturas

      - name: Medir (Windows)
        if: runner.os == 'Windows'
        run: python pr/tests/rendimiento/correr.py --pr pr --base base --trabajo "${{ runner.temp }}/rendimiento" --rondas "$env:RENDIMIENTO_RONDAS" --capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendimiento-${{ matrix.plat }}
          path: ${{ runner.temp }}/rendimiento/salida
          if-no-files-found: warn
