name: Build Installer Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build installer executable
        shell: pwsh
        run: |
          python build_installer.py

      - name: Find built executable
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found under dist/."
            exit 1
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $name = "${{ github.event.inputs.release_name }}"
          if ([string]::IsNullOrWhiteSpace($name)) { $name = $tag }

          $args = @("release", "create", $tag, "${{ steps.artifact.outputs.path }}", "--title", $name, "--notes", "Automated release from workflow_dispatch")

          if ("${{ github.event.inputs.draft }}" -eq "true") { $args += "--draft" }
          if ("${{ github.event.inputs.prerelease }}" -eq "true") { $args += "--prerelease" }

          gh @args
