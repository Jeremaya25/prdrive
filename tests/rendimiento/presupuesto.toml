# Lo que la comprobación de tiempos (`correr.py`, `rendimiento.yml`) exige y lo que se propone.
#
# [techo]    Cuentas deterministas: un PR que supera uno FALLA. Es un trinquete: se baja en
#            el PR que consigue la rebaja (el resumen del trabajo avisa cuando se puede) y se
#            sube solo diciéndolo en la descripción del PR. Las claves:
#              widgets.<pantalla>[.p5|.p50]   widgets de la pantalla recién abierta, con 5 o 50 parejas
#              widgets.main_leida[.p5|.p50]   widgets de la principal con la lectura compartida ya aplicada
#                                             (`llega-instantanea`, flujo `principal`), con 5 o 50 parejas
#              modulos.<pantalla>             len(sys.modules) al llamar a mainloop() la primera vez
#              tema.arranque.<pantalla>       pasadas de <<ThemeChanged>> hasta el primer pintado
#              tema.abrir.<pantalla>          ... al abrir «Parejas» / «Ajustes» con el programa abierto
#              tema.apartado                  ... al cambiar de apartado en «Ajustes»
#              estilos.<pantalla>             estilos de ttk creados después del primer widget
#              escrituras.marcar              escrituras a state/ (store.write_json) dentro del clic en
#                                             una casilla de la ventana principal: 1 en la 0.7.1
#              widgets.dispositivos           widgets de «Dispositivos» con la flota de muestra (12 dispositivos)
#                                             ya llegada, la ficha del primero a la vista
#              widgets.flags                  widgets del editor de flags de la primera pareja del dispositivo
#                                             de muestra (sin flags propios)
#              widgets.pareja                 widgets de la ventana de esa pareja («Modificar…»), recién abierta
#                                             y con «Avanzado» plegado
#              tema.abrir.dispositivos|flags|pareja, estilos.dispositivos|flags|pareja
#                                             lo mismo que para «Parejas» y «Ajustes»
#            `[techo.windows]` y `[techo.linux]` sustituyen a `[techo]` en esa plataforma (los
#            módulos importados son los de cada sistema).
# [meta]     Las mismas cuentas, a donde quiere llegar el diseño: solo se informan.
# [meta_ms]  Medianas en Windows x64 al 100 % con 5 parejas (spec «Qué se quiere»): solo se informan.
#            Los de la ventana ya abierta (marcar, elegir, volver, sincronizar, reabrir) son los de la
#            tabla «Acción con la ventana abierta»; «llega-instantanea» se informa sin meta.
#
# Medidos el 08/10/2026 en el árbol de la 0.7.1, con el Python fijado (3.14.8, Tk 9.0.4); los
# módulos, en la primera ejecución en CI de la etapa 1a (Rendimiento 37843538665), que es
# donde se miden: fuera de CI salen distintos. Bajados al cerrar la etapa 2 (09/10/2026) a lo
# que da la rama con las tareas 2 y 3 de la etapa 3 (la barra horizontal que no se crea hasta
# hacer falta quita un widget a cada ventana); los módulos, de Rendimiento 37917304018.

