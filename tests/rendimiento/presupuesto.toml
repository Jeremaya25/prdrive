# Lo que la comprobación de tiempos (`correr.py`, `rendimiento.yml`) exige y lo que se propone.
#
# [techo]    Cuentas deterministas: un PR que supera uno FALLA. Es un trinquete: se baja en
#            el PR que consigue la rebaja (el resumen del trabajo avisa cuando se puede) y se
#            sube solo diciéndolo en la descripción del PR. Las claves:
#              widgets.<pantalla>[.p5|.p50]   widgets de la pantalla recién abierta, con 5 o 50 parejas
#              modulos.<pantalla>             len(sys.modules) al llamar a mainloop() la primera vez
#              tema.arranque.<pantalla>       pasadas de <<ThemeChanged>> hasta el primer pintado
#              tema.abrir.<pantalla>          ... al abrir «Parejas» / «Ajustes» con el programa abierto
#              tema.apartado                  ... al cambiar de apartado en «Ajustes»
#              estilos.<pantalla>             estilos de ttk creados después del primer widget
#            `[techo.windows]` y `[techo.linux]` sustituyen a `[techo]` en esa plataforma (los
#            módulos importados son los de cada sistema).
# [meta]     Las mismas cuentas, a donde quiere llegar el diseño: solo se informan.
# [meta_ms]  Medianas en Windows x64 al 100 % con 5 parejas (spec «Qué se quiere»): solo se informan.
#
# Medidos el 08/10/2026 en el árbol de la 0.7.1, con el Python fijado (3.14.8, Tk 9.0.4).

