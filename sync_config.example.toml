# Ejemplo de configuración de prdrive.
#
# Este MISMO esquema sirve para dos ficheros distintos:
#
#   * `.prdrive/sync_config.toml` — el config de UN dispositivo: qué sincroniza
#     él. Lo genera el instalador y lo mantiene la ventana de parejas.
#   * `pairs.toml` en tu remoto — el catálogo: qué parejas EXISTEN, para todos
#     los dispositivos. Admite además la tabla [remote] de abajo.
#
# Todo lo que hay aquí es un ejemplo: cambia el remote, las rutas y las parejas
# por las tuyas.


# ---------------------------------------------------------------------------
# [remote] — SOLO en el catálogo.
# ---------------------------------------------------------------------------
# Cómo se define el remote en el rclone.conf de cada dispositivo. Es lo que hace
# que la conexión se teclee una sola vez: el primer dispositivo la escribe aquí y
# los demás la heredan al instalarse. Son las mismas claves que usarías en un
# rclone.conf, así que vale cualquier backend de rclone.
#
# La clave privada NO va aquí y nunca sube al remoto: viaja dentro de cada
# dispositivo, en `.prdrive/keys/`.

[remote]
name = "nas"                  # el nombre del remote; el que usan los remote_path
type = "sftp"
host = "servidor.ejemplo.com"
port = 22
user = "usuario-dedicado"
disable_hashcheck = true      # muchos SFTP no ofrecen md5sum por SSH
shell_type = "none"


# ---------------------------------------------------------------------------
# [defaults] — lo que vale para todas las parejas
# ---------------------------------------------------------------------------

[defaults]
remote = "nas"                # tiene que coincidir con [remote].name
catalog_path = "/prdrive-catalog/pairs.toml"   # el fichero, no su carpeta

# Filtros que se suman a los de cada pareja.
exclude = [
    "**/.stfolder/**",
    "**/.stversions/**",
    "**/.stignore",
]

# keep_logs = true            # guarda también los logs de las pasadas buenas

# El lado local va como un remote 'combine' propio en vez de como ruta absoluta,
# y así el nombre de los listados de bisync no depende de dónde esté montado el
# dispositivo. Lo escribe el instalador en cada dispositivo nuevo. Ponerlo o
# quitarlo a mano cambia ese nombre: exige un --resync.
device_remote = "disp"

# Flags de rclone para todas las parejas. La clave es el flag sin '--', y '_' se
# convierte en '-'. Añadir un flag es editar esto, nunca el código.
[defaults.flags]
checkers = 8
transfers = 4


# ---------------------------------------------------------------------------
# [daemon] — el servicio periódico
# ---------------------------------------------------------------------------

[daemon]
pairs = ["docs", "claves"]    # qué sincroniza; si falta, todas
interval_minutes = 30


# ---------------------------------------------------------------------------
# [[pair]] — una carpeta sincronizada
# ---------------------------------------------------------------------------
# modo        qué hace                              borra en
# ----------  ------------------------------------  ---------------------
# bisync      dos direcciones, detecta cambios      — (freno --max-delete 25)
# up          copia dispositivo -> remoto           nada
# down        copia remoto -> dispositivo           nada
# up-mirror   espejo dispositivo -> remoto          EL REMOTO
# down-mirror espejo remoto -> dispositivo          EL DISPOSITIVO

[[pair]]
name = "docs"
local = "sync-data/docs"      # relativa a la raíz del dispositivo
remote_path = "/datos/docs"   # ruta dentro del remote
mode = "bisync"
versions = true               # ver más abajo

[pair.flags]
conflict-resolve = "newer"    # con qué copia se queda si los dos lados cambiaron;
                              # la otra se guarda al lado con el sufijo de su lado
                              # (conflict-suffix, que ya trae el modo bisync)
resilient = true              # un error menor no obliga a --resync la próxima vez

# ---------------------------------------------------------------------------
# versions — guardar lo que se pierde
# ---------------------------------------------------------------------------
# Solo en bisync: en copy/sync no hay dos lados que guardar, y el config se
# rechaza si se pone en otro modo.
#
# Con `versions = true`, cada lado aparta en `.prversions/` —dentro de la propia
# pareja— lo que ÉL pierde, con la estructura de carpetas del pair y el nombre
# `<nombre>~<YYYYMMDD>-<HHMMSS>.<ext>`:
#
#     sync-data/docs/.prversions/informes/2026/memoria~20260922-093000.docx
#
# Cubre lo que se sobrescribe, lo que se borra (también el borrado que llega del
# otro lado) y el perdedor de un conflicto, que así deja de quedarse suelto
# dentro de la carpeta como `<nombre>.conflicto-remoto1`.
#
# Tres cosas que conviene saber antes de encenderlo:
#
#   * Son DOS históricos independientes, no una copia. bisync excluye
#     `.prversions/`, y esa exclusión no es una preferencia: es la condición que
#     pone rclone para aceptar un --backup-dir dentro del destino. Cada lado
#     guarda lo suyo. Es lo mismo que hace Syncthing con `.stversions`.
#   * Encenderlo o apagarlo cambia el fichero de filtros, así que la pareja
#     pedirá un --resync.
#   * Al apagarlo, `.prversions/` deja de estar excluida y lo que haya guardado
#     empezará a sincronizarse al otro lado como contenido normal. Vacíala
#     antes si no lo quieres allí.
#
# Nadie la limpia sola: se mira y se purga desde «Ajustes…» → «Versiones…».


[[pair]]
name = "claves"
local = "sync-data/claves"
remote_path = "/datos/claves"
mode = "bisync"

[pair.flags]
conflict-resolve = "larger"


[[pair]]
name = "subir"
local = "sync-data/subir"
remote_path = "/datos/entrada"
mode = "up"                   # solo sube; nunca borra en el remoto
