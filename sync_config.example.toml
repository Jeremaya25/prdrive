# Ejemplo de configuración de prdrive.
#
# Este MISMO esquema sirve para dos ficheros distintos:
#
#   * `.prdrive/sync_config.toml` — el config de UN dispositivo: qué sincroniza
#     él. Lo genera el instalador y lo mantiene la ventana de parejas.
#   * `remote.toml` en tu remoto — el catálogo: qué parejas EXISTEN, para todos
#     los dispositivos. Admite además la tabla [remote] de abajo. En un remoto
#     de antes se llama `pairs.toml`: prdrive encuentra los dos, y «Ajustes» →
#     «Renombrar el catálogo…» lo pasa al nombre nuevo.
#
# Todo lo que hay aquí es un ejemplo: cambia el remote, las rutas y las parejas
# por las tuyas.


# ---------------------------------------------------------------------------
# [remote] — SOLO en el catálogo.
# ---------------------------------------------------------------------------
# Cómo se define el remote en el rclone.conf de cada dispositivo. Es lo que hace
# que la conexión se teclee una sola vez: el primer dispositivo la escribe aquí y
# los demás la heredan al instalarse. Son las mismas claves que usarías en un
# rclone.conf, así que vale cualquier backend de rclone.
#
# La clave privada NO va aquí y nunca sube al remoto: viaja dentro de cada
# dispositivo, en `.prdrive/keys/`.

[remote]
name = "nas"                  # el nombre del remote; el que usan los remote_path
type = "sftp"
host = "servidor.ejemplo.com"
port = 22
user = "usuario-dedicado"
disable_hashcheck = true      # muchos SFTP no ofrecen md5sum por SSH
shell_type = "none"


# ---------------------------------------------------------------------------
# [defaults] — lo que vale para todas las parejas
# ---------------------------------------------------------------------------

[defaults]
remote = "nas"                # tiene que coincidir con [remote].name
catalog_path = "/prdrive-catalog/remote.toml"  # el fichero, no su carpeta

# Filtros que se suman a los de cada pareja.
exclude = [
    "**/.stfolder/**",
    "**/.stversions/**",
    "**/.stignore",
]

# keep_logs = true            # guarda también los logs de las pasadas buenas

# El lado local va como un remote 'combine' propio en vez de como ruta absoluta,
# y así el nombre de los listados de bisync no depende de dónde esté montado el
# dispositivo. Lo escribe el instalador en cada dispositivo nuevo. Ponerlo o
# quitarlo a mano cambia ese nombre: exige un --resync.
device_remote = "disp"

# Flags de rclone para todas las parejas. La clave es el flag sin '--', y '_' se
# convierte en '-'. Añadir un flag es editar esto, nunca el código.
[defaults.flags]
checkers = 8
transfers = 4


# ---------------------------------------------------------------------------
# [daemon] — el servicio periódico
# ---------------------------------------------------------------------------

[daemon]
pairs = ["docs", "claves"]    # qué sincroniza; si falta, todas
interval_minutes = 30


# ---------------------------------------------------------------------------
# [keychain] — el llavero: una base de KeePassXC que se sincroniza sola
# ---------------------------------------------------------------------------
# Lo escribe «Ajustes → Llavero…» (o el asistente), aquí y en el catálogo: no
# hace falta tocarlo a mano. Con él prdrive construye su propia pareja,
# `keychain`: la base vive en `.keychain/` del dispositivo y viaja a la
# subcarpeta `keychain/` de la carpeta del catálogo, en bisync con versiones.
# Esa pareja no se cambia desde aquí (ni los [defaults] le llegan), se
# resincroniza sola cuando hace falta, y su nombre queda reservado: ninguna
# [[pair]] puede llamarse `keychain` mientras esté esta tabla. Una pareja de la
# raíz entera (`local = "."`) deja fuera `.keychain/`.
#
# El fichero llave NO viaja, ni se guarda su huella: `fichero_llave` solo dice
# que la base lo pide, y `nombre_llave` es una pista para que otro dispositivo
# sepa cuál buscar. Dónde está en cada equipo lo apunta prdrive aparte
# (`.prdrive/state/keychain.json`).
#
# [keychain]
# base = "personal.kdbx"          # un nombre suelto que acabe en .kdbx, en minúsculas
# fichero_llave = true
# nombre_llave = "personal.keyx"  # solo una pista: ni ruta ni huella


# ---------------------------------------------------------------------------
# [[pair]] — una carpeta sincronizada
# ---------------------------------------------------------------------------
# modo        qué hace                              borra en
# ----------  ------------------------------------  ---------------------
# bisync      dos direcciones, detecta cambios      — (freno --max-delete 25)
# up          copia dispositivo -> remoto           nada
# down        copia remoto -> dispositivo           nada
# up-mirror   espejo dispositivo -> remoto          EL REMOTO
# down-mirror espejo remoto -> dispositivo          EL DISPOSITIVO

[[pair]]
name = "docs"
local = "sync-data/docs"      # relativa a la raíz del dispositivo
remote_path = "/datos/docs"   # ruta dentro del remote
mode = "bisync"
versions = true               # ver más abajo
watch = true                  # ver más abajo

[pair.flags]
conflict-resolve = "newer"    # con qué copia se queda si los dos lados cambiaron;
                              # la otra se guarda al lado con el sufijo de su lado
                              # (conflict-suffix, que ya trae el modo bisync)
resilient = true              # un error menor no obliga a --resync la próxima vez

# ---------------------------------------------------------------------------
# versions — guardar lo que se pierde
# ---------------------------------------------------------------------------
# Solo en bisync: en copy/sync no hay dos lados que guardar, y el config se
# rechaza si se pone en otro modo.
#
# Con `versions = true`, cada lado aparta en `.prversions/` —dentro de la propia
# pareja— lo que ÉL pierde, con la estructura de carpetas del pair y el nombre
# `<nombre>~<YYYYMMDD>-<HHMMSS>.<ext>`:
#
#     sync-data/docs/.prversions/informes/2026/memoria~20260922-093000.docx
#
# Cubre lo que se sobrescribe, lo que se borra (también el borrado que llega del
# otro lado) y el perdedor de un conflicto, que así deja de quedarse suelto
# dentro de la carpeta como `<nombre>.conflicto-remoto1`.
#
# Tres cosas que conviene saber antes de encenderlo:
#
#   * Son DOS históricos independientes, no una copia. bisync excluye
#     `.prversions/`, y esa exclusión no es una preferencia: es la condición que
#     pone rclone para aceptar un --backup-dir dentro del destino. Cada lado
#     guarda lo suyo. Es lo mismo que hace Syncthing con `.stversions`.
#   * Encenderlo o apagarlo cambia el fichero de filtros, así que la pareja
#     pedirá un --resync.
#   * Al apagarlo, `.prversions/` deja de estar excluida y lo que haya guardado
#     empezará a sincronizarse al otro lado como contenido normal. Vacíala
#     antes si no lo quieres allí.
#
# Nadie la limpia sola: se mira y se purga desde «Ajustes…» → «Versiones…».

# ---------------------------------------------------------------------------
# watch — sincronizar al cambiar los ficheros, no al llegar el intervalo
# ---------------------------------------------------------------------------
# Con `watch = true` el AGENTE RESIDENTE sincroniza la pareja poco después de que
# cambien sus ficheros locales, en vez de esperar a los 30 minutos del servicio.
# Solo vale donde el lado local es origen (bisync, up, up-mirror) y el config se
# rechaza en down y down-mirror. Sin la clave, la pareja va por su intervalo,
# como siempre. Se pide en cada `[[pair]]`: en `[defaults]` no se admite (el
# config se rechaza), porque ahí no haría nada. El servicio de runsync (sin
# agente) no mira los cambios.
#
# Cómo funciona, y lo que conviene saber antes de encenderlo:
#
#   * Mira la carpeta cada 10 s con `os.scandir`, sin abrir ficheros ni usar
#     eventos del sistema (valen una exFAT, un contenedor de VeraCrypt o una
#     carpeta de red). Compara rutas, tamaños y mtimes con la vuelta anterior.
#   * Espera 20 s sin más cambios antes de lanzar la pasada: una ráfaga de
#     ficheros es UNA pasada. Y no lanza dos pasadas de la misma pareja con
#     menos de 2 minutos entre ellas.
#   * Es una pasada corriente adelantada, no «Sincronizar ahora»: con el agente en
#     pausa, con batería o en una red de uso medido, espera como las demás.
#     Una pareja que está fallando mantiene su espera creciente.
#   * Solo ve los cambios LOCALES. Lo que cambie en el remoto espera al
#     intervalo. Tampoco ve lo que se cambie mientras la propia pasada corre: al
#     acabar se vuelve a mirar la carpeta, para que lo que rclone escribió no
#     dispare otra pasada, y eso se lleva por delante lo que la persona tocara
#     entre medias; también espera al intervalo.
#   * Con más de 20 000 ficheros y carpetas la pareja deja de vigilarse (el
#     agente lo apunta una vez en su diario) y sigue por su intervalo: recorrer
#     una carpeta así cada pocos segundos cuesta más de lo que da, sobre todo en
#     un pendrive. `.prversions/` y `.prdrive/` no cuentan, y con `local = "."`
#     (la raíz de la unidad) tampoco lo que el sistema deja en ella: `System
#     Volume Information`, `$RECYCLE.BIN`, `.Trash-<uid>`…
#   * Si el agente no puede mirar la carpeta (tres recorridos seguidos sin
#     foto), lo apunta en su diario y la pareja sigue por su intervalo.
#   * Solo en una raíz que el agente sirve en modo `daemon` y mientras esté
#     abierta, sin pausar y sin ventana delante; en modo `sync` (una pasada por
#     conexión) no hace nada.


[[pair]]
name = "claves"
local = "sync-data/claves"
remote_path = "/datos/claves"
mode = "bisync"

[pair.flags]
conflict-resolve = "larger"


[[pair]]
name = "subir"
local = "sync-data/subir"
remote_path = "/datos/entrada"
mode = "up"                   # solo sube; nunca borra en el remoto
